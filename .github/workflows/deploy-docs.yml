name: Documentation

# Builds the book on every PR that could change it, and publishes to gh-pages on
# main. `gradeit/**` is in the path filter because the API reference is generated
# from docstrings by autodoc -- without it, a docstring fix would never reach the
# site.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "gradeit/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "gradeit/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Jupyter Book 1.x pins sphinx<8 and a long transitive chain; 3.12 is the
      # least turbulent for it. The test matrix still covers 3.10-3.13.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"

      - name: Convert examples to notebooks
        run: python docs/examples/_convert_examples_to_notebooks.py

      # Note: MPLBACKEND is deliberately NOT set here. The notebook kernel would
      # inherit it and inline figure capture would silently produce no plots.
      - name: Build the book
        run: jupyter-book build docs/

      - name: Upload built HTML
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
